<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;padding:20px;background:#f7f7f7}
    .contact-form{max-width:600px;margin:0 auto;background:#fff;padding:24px;border:1px solid #ddd;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .contact-form h1{margin-top:0;font-size:24px}
    label{display:block;margin-bottom:8px;font-weight:600}
    input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:4px;margin-bottom:16px;box-sizing:border-box}
    button{padding:12px 18px;background:#007acc;color:#fff;border:none;border-radius:4px;cursor:pointer}
    button:hover{background:#005fa3}
  </style>
</head>
<body>
  <div class="contact-form">
    <h1>Contact Us</h1>
    <form action="#" method="post">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="Subject" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>
</body>
</html>
